<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Run Player</title>
<link rel="icon" href="data:,">
<style>
  :root { --fg:#f4f6f8; --dim:#aab4be; --accent:#ffb300; --panel:rgba(12,16,22,.62); }
  html,body { margin:0; height:100%; background:#000; color:var(--fg); font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #stage { position:absolute; background:#000; }
  #stage video, #stage canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  #stage canvas { pointer-events:none; }
  .hud { position:absolute; pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.7); }
  .hidden-hud .hud, .hidden-hud #controls { display:none !important; }
  #stats { left:2%; top:3%; background:var(--panel); border-radius:10px; padding:10px 14px; display:grid; grid-template-columns:auto auto; gap:2px 16px; backdrop-filter:blur(6px); }
  #stats .k { color:var(--dim); font-size:.8em; text-transform:uppercase; letter-spacing:.06em; align-self:center; }
  #stats .v { font-variant-numeric:tabular-nums; font-weight:600; text-align:right; }
  #stats .big { grid-column:1/3; font-size:2.1em; font-weight:700; color:var(--accent); line-height:1.1; margin-bottom:4px; }
  #pacers { right:2%; top:3%; min-width:200px; background:var(--panel); border-radius:10px; padding:8px 12px; backdrop-filter:blur(6px); }
  #pacers h4 { margin:0 0 4px; font-size:.75em; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  #pacers .row { display:flex; align-items:center; gap:8px; padding:2px 0; font-variant-numeric:tabular-nums; }
  #pacers .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  #pacers .nm { flex:1; } #pacers .gap { font-weight:700; min-width:64px; text-align:right; }
  #pacers .row.behind { opacity:.62; } #pacers .row.far { opacity:.45; }
  #pacers .sep { border-top:1px solid rgba(255,255,255,.15); margin:5px 0; }
  #controls { position:absolute; left:0; right:0; bottom:0; padding:22px 2% 10px; background:linear-gradient(transparent,rgba(0,0,0,.65)); display:flex; align-items:center; gap:14px; opacity:.0; transition:opacity .2s; }
  #stage:hover #controls, #controls:focus-within { opacity:1; }
  #controls button { background:rgba(255,255,255,.14); border:0; color:#fff; border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  #controls button:hover { background:rgba(255,255,255,.25); }
  #seek { flex:1; accent-color:var(--accent); }
  #pace { width:170px; accent-color:var(--accent); }
  #controls label { color:var(--dim); font-size:.85em; white-space:nowrap; }
  #msg { left:50%; top:50%; transform:translate(-50%,-50%); background:var(--panel); padding:10px 18px; border-radius:10px; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" muted playsinline preload="auto"></video>
  <canvas id="gl"></canvas>
  <div id="stats" class="hud">
    <div class="big" id="hPace">6:00 /km</div>
    <div class="k">Distance</div><div class="v" id="hDist">0 m</div>
    <div class="k">Course time</div><div class="v" id="hTime">0:00</div>
    <div class="k">Incline</div><div class="v" id="hInc">0.0 %</div>
  </div>
  <div id="pacers" class="hud"></div>
  <div id="msg" class="hud">Loading…</div>
  <div id="controls">
    <button id="bPlay">Pause</button>
    <input id="seek" type="range" min="0" max="1" step="1" value="0">
    <label>Pace <input id="pace" type="range" min="240" max="540" step="5" value="360"> <b id="paceLbl">6:00</b>/km</label>
    <button id="bHud" title="H">HUD</button>
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
